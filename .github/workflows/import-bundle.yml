name: Import VINSETT Forge history

on:
  push:
    paths:
      - history/import-ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify history/vinsett-forge-ai-v0.6.0.bundle

      - name: Import original branch and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch history/vinsett-forge-ai-v0.6.0.bundle \
            'refs/heads/main:refs/remotes/bundle/main' \
            'refs/tags/*:refs/tags/*'
          git push origin refs/remotes/bundle/main:refs/heads/main --force
          git push origin --tags --force

      - name: Verify imported refs
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main refs/tags/v0.1.0-foundation refs/tags/v0.6.0-milestone6
