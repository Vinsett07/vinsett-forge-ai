name: Import VINSETT Forge history

on:
  push:
    paths:
      - .import/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-* > /tmp/vinsett-forge-ai.bundle.b64
          base64 --decode /tmp/vinsett-forge-ai.bundle.b64 > /tmp/vinsett-forge-ai.bundle
          git bundle verify /tmp/vinsett-forge-ai.bundle

      - name: Import original branch and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch /tmp/vinsett-forge-ai.bundle \
            'refs/heads/main:refs/remotes/bundle/main' \
            'refs/tags/*:refs/tags/*'
          git push origin refs/remotes/bundle/main:refs/heads/main --force
          git push origin --tags --force

      - name: Verify imported main
        shell: bash
        run: |
          set -euo pipefail
          echo "Imported main: $(git rev-parse refs/remotes/bundle/main)"
          git ls-remote origin refs/heads/main refs/tags/v0.6.0-milestone6
