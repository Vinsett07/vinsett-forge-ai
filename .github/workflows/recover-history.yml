name: Recover original milestone history
on:
  push:
    branches: [fix/restore-forge-v060]
    paths: [history/recovered-v0.6.0.bundle]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Import verified original objects and preserve both histories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch history/recovered-v0.6.0.bundle \
            'refs/heads/main:refs/remotes/recovered/main' \
            'refs/tags/*:refs/tags/*'
          git fsck --full
          git merge --allow-unrelated-histories -s ours --no-edit refs/remotes/recovered/main
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" --follow-tags
